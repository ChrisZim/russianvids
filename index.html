<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Russianvids Player</title>
<style>
/* Layout: player pane on the left (sticky on wide screens), searchable library on the right; stacks on phones. */
:root{
  --bg:#f5f4f1; --panel:#ffffff; --ink:#1d1f22; --muted:#666b73; --line:#dedbd4;
  --accent:#b23a2a; --accent-ink:#ffffff; --track:#e7e3dc; --done:#2f7d4f;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141518; --panel:#1d1f23; --ink:#ecebe8; --muted:#9a9ea6; --line:#2e3036;
  --accent:#e0614d; --accent-ink:#141518; --track:#2c2e33; --done:#4fbf7d; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
button,input,select{font:inherit;color:inherit}
.wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;max-width:1500px;margin:0 auto;padding:16px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}}
.player{position:sticky;top:16px;align-self:start;display:grid;gap:10px}
@media (max-width:900px){.player{position:static}}
.screen{background:#000;border-radius:8px;overflow:hidden;aspect-ratio:16/9}
video{width:100%;height:100%;display:block;background:#000}
.empty{color:#aaa;text-align:center;padding:20px}
#now h2{margin:0;font-size:17px;line-height:1.3;text-wrap:balance}
#now .meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 10px;cursor:pointer}
a.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{color:var(--muted);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}
.saveRow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.saveRow label{font-size:13px;color:var(--muted)}
.saveRow input{flex:1 1 140px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-family:var(--mono)}
.saveRow.ask{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.prog.big{height:6px}
.lib{display:grid;gap:10px;min-width:0}
.head h1{margin:0;font-size:20px}
.stats{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:8px;flex-wrap:wrap}
.bar input[type=search]{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.bar select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.section-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.list{display:grid;gap:4px;max-height:calc(100vh - 230px);overflow:auto;padding-right:4px}
@media (max-width:900px){.list{max-height:none}}
.cont{display:grid;gap:4px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;cursor:pointer}
.row.on{border-color:var(--accent)}
.row .n{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-width:2.6em;text-align:right}
.row .t{min-width:0}
.row .tt{overflow-wrap:anywhere}
.row .sub{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.row .dur{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.prog{height:4px;background:var(--track);border-radius:2px;margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.row.watched .prog i{background:var(--done)}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.tag.w{border-color:var(--done);color:var(--done)}
.more{justify-self:center}
</style>
</head>
<body>
<div class="wrap">
  <section class="player" aria-label="Now watching">
    <div class="card" id="pick">Pick a video from the list. It plays here and saves your place as you watch.</div>
    <div class="card" id="now" hidden>
      <h2 id="nowTitle"></h2>
      <div class="meta"><span id="nowLen"></span><span id="nowState"></span></div>
      <div class="prog big"><i id="nowBar"></i></div>
      <div class="screen" id="screen" hidden></div>
      <div class="controls" id="vc" hidden>
        <button class="btn" id="back30" type="button">&#8722;30s</button>
        <button class="btn" id="fwd30" type="button">+30s</button>
        <button class="btn" id="speed" type="button">1&#215;</button>
      </div>
      <div class="controls">
        <button class="btn primary" id="playHere" type="button">Play</button>
        <button class="btn" id="playHereStart" type="button">Play from start</button>
      </div>
      <div class="controls">
        <button class="btn" id="markW" type="button">Mark watched</button>
        <button class="btn" id="restart" type="button">Reset progress</button>
        <a class="btn" id="playFrom" target="_blank" rel="noopener">Open in phone player</a>
        <a id="playStart" hidden></a>
      </div>
      <div class="saveRow" id="saveRow" hidden>
        <label for="stopAt">I stopped at</label>
        <input id="stopAt" inputmode="decimal" placeholder="e.g. 45:10 or 1:05:30" autocomplete="off">
        <button class="btn primary" id="saveBtn" type="button">Save my place</button>
      </div>
      <div class="note" id="msg"></div>
    </div>
    <div class="note">Progress is kept in this browser. Use Backup to copy it to another device.</div>
  </section>

  <section class="lib" aria-label="Library">
    <div class="head">
      <h1>Russianvids</h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="bar">
      <input type="search" id="q" placeholder="Search titles" aria-label="Search titles">
      <select id="sort" aria-label="Sort">
        <option value="long">Longest first</option>
        <option value="short">Shortest first</option>
        <option value="az">A to Z</option>
        <option value="recent">Recently watched</option>
      </select>
      <select id="show" aria-label="Show">
        <option value="all">All</option>
        <option value="unwatched">Not started</option>
        <option value="progress">In progress</option>
        <option value="watched">Watched</option>
      </select>
    </div>
    <div class="bar">
      <label class="chk"><input type="checkbox" id="hideDup"> Hide likely duplicates</label>
      <button class="btn" id="exp" type="button">Backup progress</button>
      <label class="btn" for="imp">Restore backup</label><input type="file" id="imp" accept=".json,application/json" hidden>
    </div>
    <div id="contWrap" hidden>
      <div class="section-label">Continue watching</div>
      <div class="cont" id="cont"></div>
    </div>
    <div class="section-label" id="listLabel">All videos</div>
    <div class="list" id="list"></div>
  </section>
</div>

const fmt=s=>{s=Math.max(0,Math.round(s||0));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const url=d=>BASE+encodeURIComponent(d.f);
const st=d=>P[d.f]||null;
const pct=d=>{const p=st(d);if(!p)return 0;if(p.w)return 100;return Math.min(100,100*(p.t||0)/(d.s||1))};
const state=d=>{const p=st(d);if(!p)return "unwatched";if(p.w)return "watched";return (p.t||0)>5?"progress":"unwatched"};

const $=id=>document.getElementById(id);
let cur=null, vid=null, lastSave=0, shown=200, awaitingReturn=false;
const parseT=v=>{v=(v||"").trim();if(!v)return null;const parts=v.split(/[:.\s]+/).filter(x=>x!=="").map(Number);if(!parts.length||parts.some(isNaN))return null;let t=0;for(const p of parts)t=t*60+p;return t};

function rowEl(d){
  const r=document.createElement("div");
  const s=state(d);
  r.className="row"+(s==="watched"?" watched":"")+(cur===d?" on":"");
  r.tabIndex=0;r.setAttribute("role","button");
  const p=st(d);
  const sub=s==="progress"?`Stopped at ${fmt(p.t)} · ${Math.round(pct(d))}%`:(s==="watched"?"Watched":`${d.mb} MB`);
  r.innerHTML=`<span class="n">${d.n}</span><span class="t"><span class="tt"></span>${s==="watched"?'<span class="tag w">Watched</span>':''}${d.dup?'<span class="tag" title="Same running time as another video">Likely duplicate</span>':''}<div class="sub">${sub}</div><div class="prog"><i style="width:${pct(d)}%"></i></div></span><span class="dur">${fmt(d.s)}</span>`;
  r.querySelector(".tt").textContent=d.t;
  r.onclick=()=>select(d);
  r.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();select(d)}};
  return r;
}

function filtered(){
  const q=$("q").value.trim().toLowerCase(), show=$("show").value, hide=$("hideDup").checked, sort=$("sort").value;
  let a=DATA.filter(d=>(!q||d.t.toLowerCase().includes(q))&&(!hide||!d.dup)&&(show==="all"||state(d)===show));
  if(sort==="long")a.sort((x,y)=>y.s-x.s);
  else if(sort==="short")a.sort((x,y)=>x.s-y.s);
  else if(sort==="az")a.sort((x,y)=>x.t.localeCompare(y.t));
  else a.sort((x,y)=>((st(y)||{}).u||0)-((st(x)||{}).u||0)||y.s-x.s);
  return a;
}

function render(){
  const a=filtered(), list=$("list");
  list.replaceChildren(...a.slice(0,shown).map(rowEl));
  if(a.length>shown){const b=document.createElement("button");b.className="btn more";b.type="button";b.textContent=`Show more (${a.length-shown} left)`;b.onclick=()=>{shown+=300;render()};list.append(b)}
  $("listLabel").textContent=`${a.length} video${a.length===1?"":"s"}`;
  const inprog=DATA.filter(d=>state(d)==="progress").sort((x,y)=>(st(y).u||0)-(st(x).u||0)).slice(0,5);
  $("contWrap").hidden=!inprog.length;
  $("cont").replaceChildren(...inprog.map(rowEl));
  const w=DATA.filter(d=>state(d)==="watched").length, ip=DATA.filter(d=>state(d)==="progress").length;
  const watchedSecs=DATA.reduce((t,d)=>{const p=st(d);return t+(p?(p.w?d.s:Math.min(p.t||0,d.s)):0)},0);
  const total=DATA.reduce((t,d)=>t+d.s,0);
  $("stats").textContent=`${DATA.length} videos · ${Math.round(total/3600)} hours · ${w} watched · ${ip} in progress · ${fmt(watchedSecs)} viewed`;
  if(cur)showNow();
}

function setPos(d,t,watched){
  const p=P[d.f]||{};
  p.t=Math.max(0,Math.min(t,d.s));p.u=Date.now();
  p.w=watched!==undefined?watched:(p.t>=d.s*0.95);
  P[d.f]=p;save();
}

function showNow(){
  const d=cur,p=st(d),s=state(d);
  const resume=s==="progress"?Math.max(0,Math.floor(p.t)-3):0;
  $("pick").hidden=true;$("now").hidden=false;
  $("nowTitle").textContent=d.t;
  $("nowLen").textContent="Length "+fmt(d.s);
  $("nowState").textContent=s==="progress"?`Stopped at ${fmt(p.t)}`:(s==="watched"?"Watched":"Not started");
  $("nowBar").style.width=pct(d)+"%";
  $("playFrom").href=url(d)+(resume?`#t=${resume}`:"");
  $("playFrom").textContent="Open in phone player";$("playHere").textContent=resume?`Play from ${fmt(resume)}`:"Play";$("playHereStart").hidden=!resume;
  $("playStart").hidden=!resume;
  $("playStart").href=url(d);
  $("markW").textContent=s==="watched"?"Mark not watched":"Mark watched";
}

function select(d){
  cur=d;$("stopAt").value="";$("msg").textContent="";$("saveRow").classList.remove("ask");
  if(vid){persist(true);vid.pause();vid=null;$("screen").replaceChildren();$("screen").hidden=true;$("vc").hidden=true}$("saveRow").hidden=true;
  render();
  if(matchMedia("(max-width:900px)").matches)window.scrollTo({top:0,behavior:"smooth"});
}

function onPlayClick(){awaitingReturn=true;$("saveRow").hidden=false;$("msg").textContent="When you come back, type where you stopped and tap Save my place."}
$("playFrom").onclick=onPlayClick;$("playStart").onclick=onPlayClick;
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){if(vid)persist(true);return}
  if(awaitingReturn&&cur){awaitingReturn=false;$("saveRow").classList.add("ask");$("stopAt").focus()}
});
$("saveBtn").onclick=()=>{
  if(!cur)return;const t=parseT($("stopAt").value);
  if(t===null){$("msg").textContent="Type the time like 45:10 or 1:05:30.";return}
  if(t>cur.s+5){$("msg").textContent=`That's past the end. This video is ${fmt(cur.s)} long.`;return}
  setPos(cur,t);$("stopAt").value="";$("saveRow").classList.remove("ask");
  $("msg").textContent=state(cur)==="watched"?"Saved. Marked as watched.":`Saved. Next time it starts from ${fmt(Math.max(0,t-3))}.`;render();
};
$("stopAt").addEventListener("keydown",e=>{if(e.key==="Enter")$("saveBtn").click()});
$("markW").onclick=()=>{if(!cur)return;const w=state(cur)!=="watched";setPos(cur,w?cur.s:0,w);render()};
$("restart").onclick=()=>{if(!cur)return;setPos(cur,0,false);$("msg").textContent="Progress reset.";render()};

function persist(force){
  if(!cur||!vid)return;const now=Date.now();
  if(!force&&now-lastSave<4000)return;lastSave=now;
  setPos(cur,vid.currentTime||0);
}
function startHere(fromStart){
  if(!cur)return;const d=cur,p=st(d);const start=!fromStart&&p&&!p.w&&(p.t||0)>5?Math.max(0,p.t-3):0;
  if(vid){vid.pause();vid=null}
  const sc=$("screen");sc.hidden=false;sc.replaceChildren();
  vid=document.createElement("video");vid.controls=true;vid.playsInline=true;vid.preload="metadata";
  vid.style.width="100%";vid.style.height="100%";
  vid.setAttribute("referrerpolicy","no-referrer");
  const AD="https://archive.org/download/russianvidstrutherconspiracycollection/russianvids/russian%20vids/";
  const iaF=d.f.replace(/\.mp4$/i,".ia.mp4");
  const srcs=(d.ia?[BASE+encodeURIComponent(iaF),AD+encodeURIComponent(iaF)]:[]).concat([url(d),AD+encodeURIComponent(d.f)]);let si=0;
  const frag=start?`#t=${Math.floor(start)}`:"";
  let tmr=null;const label=()=>`Loading (server ${si+1} of ${srcs.length})…`;
  const next=()=>{clearTimeout(tmr);if(!vid)return;if(++si<srcs.length){$("msg").textContent=label();vid.src=srcs[si]+frag;vid.play().catch(()=>{});tmr=setTimeout(next,15000)}else{$("msg").textContent="archive.org isn't sending this video to the page. Use Open in phone player, then save your place below.";$("saveRow").hidden=false}};
  vid.src=srcs[0]+frag;tmr=setTimeout(next,15000);
  let rate=1;try{rate=+localStorage.getItem("rvplayer.rate")||1}catch(e){}
  vid.addEventListener("loadedmetadata",()=>{clearTimeout(tmr);if(start&&vid.currentTime<1)vid.currentTime=start;vid.playbackRate=rate;$("speed").textContent=rate+"×";$("msg").textContent="Your place saves automatically."});
  vid.addEventListener("timeupdate",()=>persist(false));
  vid.addEventListener("pause",()=>{persist(true);render()});
  vid.addEventListener("seeked",()=>persist(true));
  vid.addEventListener("ended",()=>{setPos(d,d.s,true);render()});
  vid.addEventListener("error",()=>{const code=vid.error?vid.error.code:"?";if(si+1<srcs.length){next();return}clearTimeout(tmr);$("msg").textContent=`Couldn't play inside the page (error ${code}${d.ia?'':', no browser copy on archive.org'}). Use Open in phone player, then save your place below.`;sc.hidden=true;$("vc").hidden=true;$("saveRow").hidden=false;vid=null});
  sc.append(vid);$("vc").hidden=false;$("msg").textContent=label();vid.play().catch(()=>{});
  sc.scrollIntoView({behavior:"smooth",block:"center"});
}
$("playHere").onclick=()=>startHere(false);
$("playHereStart").onclick=()=>startHere(true);
$("back30").onclick=()=>{if(vid){vid.currentTime=Math.max(0,vid.currentTime-30)}};
$("fwd30").onclick=()=>{if(vid){vid.currentTime=Math.min(vid.duration||1e9,vid.currentTime+30)}};
const RATES=[1,1.25,1.5,1.75,2];
$("speed").onclick=()=>{if(!vid)return;const r=RATES[(RATES.indexOf(vid.playbackRate)+1)%RATES.length]||1;vid.playbackRate=r;$("speed").textContent=r+"×";try{localStorage.setItem("rvplayer.rate",r)}catch(e){}};

["q","sort","show","hideDup"].forEach(id=>$(id).addEventListener("input",()=>{shown=200;render()}));
$("exp").onclick=()=>{
  const blob=new Blob([JSON.stringify({app:"rvplayer",saved:new Date().toISOString(),progress:P},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Russianvids progress "+new Date().toISOString().slice(0,10)+".json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
};
$("imp").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const j=JSON.parse(await f.text());const inc=j.progress||j;
    let n=0;for(const k in inc){const a=P[k],b=inc[k];if(!a||(b.u||0)>(a.u||0)){P[k]=b;n++}}
    save();render();alert(`Restored progress for ${n} video${n===1?"":"s"}.`);
  }catch(err){alert("That file isn't a progress backup from this player.")}
  e.target.value="";
};
addEventListener("pagehide",()=>{if(vid)persist(true)});
render();
</script>
</body>
</html>
